<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Top arc: left to right over top -->
    <path id="topBadgeArc" d="M 16,60 A 44,44 0 0,1 104,60" />
    <!-- Bottom arc: right to left along bottom so text is upright -->
    <path id="bottomBadgeArc" d="M 104,60 A 44,44 0 0,1 16,60" />
  </defs>
  
  <!-- Outer subtle circular border -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  
  <!-- Top Text: GENESIS CLOTHING -->
  <text font-size="8.5" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, sans-serif" font-weight="700" letter-spacing="3.2">
    <textPath href="#topBadgeArc" startOffset="50%" text-anchor="middle">
      GENESIS CLOTHING
    </textPath>
  </text>
  
  <!-- Bottom Text: HERITAGE WEAR -->
  <text font-size="8.5" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, sans-serif" font-weight="700" letter-spacing="3.2">
    <textPath href="#bottomBadgeArc" startOffset="50%" text-anchor="middle">
      HERITAGE WEAR
    </textPath>
  </text>
  
  <!-- Dot separators -->
  <circle cx="15" cy="60" r="2.2" fill="rgba(255,255,255,0.8)" />
  <circle cx="105" cy="60" r="2.2" fill="rgba(255,255,255,0.8)" />
  
  <!-- Center Stylized G Monogram Shield -->
  <rect x="42" y="42" width="36" height="36" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <text x="60" y="68" font-size="24" fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle">G</text>
</svg>
